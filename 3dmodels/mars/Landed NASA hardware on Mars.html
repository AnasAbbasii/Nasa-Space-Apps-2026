<style>
:root{--bg:#f3ece6;--fg:#2a1a14;--panel:rgba(255,248,242,.88);--line:rgba(0,0,0,.14);--acc:#c1440e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07070b;--fg:#f1e6df;--panel:rgba(20,16,18,.82);--line:rgba(255,255,255,.14);--acc:#ff8a57}}
:root[data-theme="dark"]{--bg:#07070b;--fg:#f1e6df;--panel:rgba(20,16,18,.82);--line:rgba(255,255,255,.14);--acc:#ff8a57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.lab{position:absolute;left:0;top:0;pointer-events:none;font-size:12px;font-weight:600;white-space:nowrap;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line);transform:translate(10px,-50%)}
header{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);max-width:340px}
h1{font-size:18px;margin:0 0 4px}header p{margin:0;font-size:12.5px;opacity:.75;line-height:1.45}
#list{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:300px;max-height:56vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
.it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;padding:9px 12px;cursor:pointer;font:inherit}
.it:last-child{border:0}.it:hover,.it.on{background:rgba(255,120,60,.14)}
.it b{font-size:13px}.it small{display:block;font-size:11.5px;opacity:.72;margin-top:2px;line-height:1.35}
.it span{color:var(--acc);font-size:11px;float:right;font-variant-numeric:tabular-nums}
@media (max-width:700px){#list{left:8px;right:8px;width:auto;max-height:34vh}header{max-width:none;right:16px}}

const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.1,100);
const G=new THREE.Group();S.add(G);
const tex=new THREE.TextureLoader().load(TEX);tex.anisotropy=8;
G.add(new THREE.Mesh(new THREE.SphereGeometry(1,96,64),new THREE.MeshStandardMaterial({map:tex,roughness:1})));
S.add(new THREE.AmbientLight(0xffffff,.55));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(3,1.5,4);S.add(sun);
// real lon/lat (east-positive, planetocentric/graphic) -> point on the sphere (lon 0 at texture's left edge)
const pos=(lat,lon,r=1)=>{const a=lat*Math.PI/180,o=lon*Math.PI/180;return new THREE.Vector3(-r*Math.cos(a)*Math.cos(o),r*Math.sin(a),r*Math.cos(a)*Math.sin(o))};
const labs=document.getElementById('labs'),list=document.getElementById('list'),M=[];
SITES.forEach((s,i)=>{
  const p=pos(s[1],s[2],1.006);
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.014,16,12),new THREE.MeshBasicMaterial({color:0xffee55}));dot.position.copy(p);G.add(dot);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.022,.028,32),new THREE.MeshBasicMaterial({color:0x00e0ff,side:2}));
  ring.position.copy(p);ring.lookAt(p.clone().multiplyScalar(2));G.add(ring);
  const l=document.createElement('div');l.className='lab';l.textContent=s[0];labs.appendChild(l);
  const b=document.createElement('button');b.className='it';b.innerHTML='<span>'+Math.abs(s[1]).toFixed(1)+'°'+(s[1]<0?'S':'N')+' '+s[2].toFixed(1)+'°E</span><b>'+s[0]+'</b> · '+s[3]+'<small>'+s[4]+'. '+s[5]+'</small>';
  b.onclick=()=>fly(i);list.appendChild(b);M.push({p,l,b,ring});
});
let rx=0.3,ry=-2.2,tx=null,ty=null,dist=3.2,drag=false,lx=0,ly=0,auto=true,sel=-1;
function fly(i){sel=i;auto=false;const s=SITES[i];ty=Math.PI/2-s[2]*Math.PI/180;tx=s[1]*Math.PI/180;dist=1.9;
  M.forEach((m,j)=>m.b.classList.toggle('on',j===i))}
cv.addEventListener('pointerdown',e=>{drag=true;auto=false;tx=ty=null;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.006;rx=Math.max(-1.4,Math.min(1.4,rx+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(1.4,Math.min(6,dist*(1+e.deltaY*.001)))},{passive:false});
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const v=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);
  if(auto)ry+=.0015;
  if(tx!==null){let d=ty-ry;d=Math.atan2(Math.sin(d),Math.cos(d));ry+=d*.08;rx+=(tx-rx)*.08}
  C.position.z+=(dist-C.position.z)*.1;
  G.rotation.set(rx,ry,0,'XYZ');G.updateMatrixWorld();
  const w=innerWidth,h=innerHeight;
  M.forEach((m,i)=>{v.copy(m.p).applyMatrix4(G.matrixWorld);const front=v.clone().normalize().dot(C.position.clone().sub(v).normalize())>0.05&&v.z>0;
    const q=v.clone().project(C);m.l.style.display=front?'block':'none';
    m.l.style.transform='translate('+((q.x+1)/2*w+10)+'px,'+((1-q.y)/2*h)+'px) translateY(-50%)';
    m.ring.scale.setScalar(1+.25*Math.sin(Date.now()/300+i))});
  R.render(S,C)})();
</script></body></html>
